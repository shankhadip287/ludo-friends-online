<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171827"><title>Ludo Friends Online</title><link rel="stylesheet" href="/style.css"></head><body><main id="app">
<section id="lobby" class="screen"><div class="brand"><div class="dice-logo">🎲</div><div><h1>Ludo Friends</h1><p>Private online rooms • Play with friends</p></div></div><div class="lobby-card"><label>Your name<input id="name" maxlength="18" placeholder="Enter your name"></label><div class="actions"><button id="create" class="primary">Create Room</button><div class="or">OR</div><label class="grow"><span>Room code</span><input id="room" maxlength="6" placeholder="ABC123" autocapitalize="characters"></label><button id="join" class="secondary">Join Room</button></div><p id="lobbyMsg" class="msg"></p></div><div class="features"><span>🔒 Private room</span><span>⚡ Real-time play</span><span>📱 Mobile friendly</span></div></section>
<section id="game" class="screen hidden"><header class="game-head"><div><div class="eyebrow">ROOM CODE</div><button id="copyCode" class="room-code">------</button><span id="copyHint"></span></div><div class="head-actions"><button id="start" class="primary small">Start Game</button><button id="leave" class="ghost">Leave</button></div></header><div class="players" id="players"></div><div class="layout"><div class="board-wrap"><div id="board" class="board"></div></div><aside class="side"><div class="turn-card"><div id="status">Waiting for players…</div><div id="dice" class="dice">—</div><button id="roll" class="primary roll">Roll Dice</button></div><div class="help"><b>How to play</b><p>Roll a 6 to bring a token out. Tap a highlighted token to move. Roll a 6 for another turn. Capture opponents on non-safe squares.</p></div><div id="tokenPanel" class="token-panel"></div></aside></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
